[workspace]
resolver = "2"
members = [
    "crates/pinn-core",
    "crates/pinn-solver",
    "crates/pinn-gui",
    "crates/pinn-app",
]

[workspace.dependencies]
serde             = { version = "1.0", features = ["derive"] }
anyhow            = "1.0"
ndarray           = { version = "0.16", features = ["std"] }
burn              = { version = "0.21", default-features = false, features = ["std", "autodiff", "wgpu"] }
nalgebra          = "0.33"
egui              = "0.29"
eframe            = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui_plot         = "0.29"
crossbeam-channel = "0.5"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
