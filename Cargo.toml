[workspace]
resolver = "2"
members = [
    "crates/pinn-core",
    "crates/pinn-solver",
    "crates/pinn-gui",
    "crates/pinn-app",
]

[workspace.dependencies]
serde             = { version = "1.0", features = ["derive"] }
anyhow            = "1.0"
ndarray           = { version = "0.16", features = ["std"] }
# Issue #74 re-investigation: 0.21.0 has a real, confirmed upstream race in burn-autodiff's
# cross-thread graph cleanup (tracel-ai/burn#5573, "A concurrent `backward()` frees another
# thread's autodiff steps") that reproduces in this codebase as "Node should have a step
# registered" - fixed by tracel-ai/burn#5647, merged 2026-09-11, but NOT in any published
# release yet. Tried pinning to that commit via git (rev 6212b88) - burn's `main` has since
# undergone a much larger `Tensor<B, D>` API shape change beyond that one fix, producing 118+
# compile errors across this codebase; a full migration is wildly disproportionate to fixing
# one concurrency bug, so this stays on the published 0.21.0 and mitigates in our own code
# instead (see `training_core.rs`'s own notes on avoiding cross-thread `.backward()` calls).
# Revisit once a stable release contains commit 6212b88 or later.
burn              = { version = "0.21", default-features = false, features = ["std", "autodiff", "wgpu", "fusion"] }
nalgebra          = "0.33"
egui              = "0.29"
eframe            = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui_plot         = "0.29"
crossbeam-channel = "0.5"
# Not for our own par_iter/parallel code (see CLAUDE.md's Phase 1/3 hardware-adaptive-
# execution notes on why not) - a direct dependency purely so pinn-app can configure
# rayon's global thread pool once at startup (PerformanceProfile -> thread count),
# capping whatever CPU-side parallelism the compiled backend (burn-ndarray, when the
# ndarray-backend feature is active) already uses internally. Already resolved
# transitively via burn/wgpu/image regardless - this adds no new supply-chain surface.
rayon             = "1"
# User-defined-problem-ingestion feature: TOML is the on-disk format for a user-authored
# ProblemSpec (pinn-core::problem_spec) - a small, pure-Rust, zero-unsafe parser with no
# further transitive dependencies of its own beyond serde (already a workspace dependency).
toml              = "0.8"
# pinn-app's `--tui` mode: a terminal dashboard for a run that has no display/window
# compositor available (SSH, headless-adjacent environments) but still wants live loss/Kt/AMR
# visibility beyond `--headless`'s plain scrolling `println!` log. `crossterm` is ratatui's own
# default backend crate - pinned explicitly (not left to ratatui's own transitive default) since
# `pinn-app`'s event loop calls `crossterm::event`/`terminal` directly for raw-mode setup and
# input polling, not just through ratatui's `Terminal` wrapper.
ratatui           = "0.29"
crossterm         = "0.28"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
