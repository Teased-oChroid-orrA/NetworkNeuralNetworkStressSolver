[workspace]
resolver = "2"
members = [
    "crates/pinn-core",
    "crates/pinn-solver",
    "crates/pinn-gui",
    "crates/pinn-app",
]

[workspace.dependencies]
serde             = { version = "1.0", features = ["derive"] }
anyhow            = "1.0"
ndarray           = { version = "0.16", features = ["std"] }
burn              = { version = "0.21", default-features = false, features = ["std", "autodiff", "wgpu", "fusion"] }
nalgebra          = "0.33"
egui              = "0.29"
eframe            = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui_plot         = "0.29"
crossbeam-channel = "0.5"
# Not for our own par_iter/parallel code (see CLAUDE.md's Phase 1/3 hardware-adaptive-
# execution notes on why not) - a direct dependency purely so pinn-app can configure
# rayon's global thread pool once at startup (PerformanceProfile -> thread count),
# capping whatever CPU-side parallelism the compiled backend (burn-ndarray, when the
# ndarray-backend feature is active) already uses internally. Already resolved
# transitively via burn/wgpu/image regardless - this adds no new supply-chain surface.
rayon             = "1"
# User-defined-problem-ingestion feature: TOML is the on-disk format for a user-authored
# ProblemSpec (pinn-core::problem_spec) - a small, pure-Rust, zero-unsafe parser with no
# further transitive dependencies of its own beyond serde (already a workspace dependency).
toml              = "0.8"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
