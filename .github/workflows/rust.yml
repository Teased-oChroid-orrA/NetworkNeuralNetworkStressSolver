name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Mesa software Vulkan driver (lavapipe)
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers

    # mold links noticeably faster than GNU ld, and this workspace's dependency tree
    # (burn/wgpu/cubecl) produces large debug binaries — link time is a real fraction of
    # total CI wall-clock here. rui314/setup-mold wires it in as the default linker for every
    # subsequent cargo invocation in this job (both Build and Run tests below) via RUSTFLAGS.
    - name: Set up mold linker
      uses: rui314/setup-mold@v1

    # Caches ~/.cargo (registry/git deps) and target/ keyed on Cargo.lock — without this,
    # every push recompiles the full burn/wgpu/cubecl dependency tree from scratch, which
    # dominates this workflow's wall-clock far more than link time or single-vs-split build
    # steps (those already share target/debug within one job run via normal incremental
    # compilation; this cache is what makes that persist ACROSS separate workflow runs).
    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --features eframe/x11,eframe/wayland --verbose

    # --test-threads=1: this workspace's wgpu/burn/cubecl tests each open their own GPU
    # compute context. Against a real GPU that's cheap; against lavapipe (llvmpipe, a
    # CPU-emulated software Vulkan renderer - confirmed the only device available on
    # GitHub-hosted runners) dozens of tests opening concurrent contexts overwhelms it and
    # produces spurious RecvError panics deep in cubecl's device channel. Serial execution
    # is slower but matches the behavior already relied on locally (the same class of
    # failure was repeatedly seen and resolved by re-running single-threaded throughout this
    # project's history - see any PR mentioning "GPU-contention-sensitive" test flakiness).
    - name: Run tests
      run: cargo test --features eframe/x11,eframe/wayland --verbose -- --test-threads=1
      env:
        RUST_BACKTRACE: 1
