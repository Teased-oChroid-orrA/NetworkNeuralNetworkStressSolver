name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Mesa software Vulkan driver (lavapipe)
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers

    - name: Build
      run: cargo build --features eframe/x11,eframe/wayland --verbose

    # --test-threads=1: this workspace's wgpu/burn/cubecl tests each open their own GPU
    # compute context. Against a real GPU that's cheap; against lavapipe (llvmpipe, a
    # CPU-emulated software Vulkan renderer - confirmed the only device available on
    # GitHub-hosted runners) dozens of tests opening concurrent contexts overwhelms it and
    # produces spurious RecvError panics deep in cubecl's device channel. Serial execution
    # is slower but matches the behavior already relied on locally (the same class of
    # failure was repeatedly seen and resolved by re-running single-threaded throughout this
    # project's history - see any PR mentioning "GPU-contention-sensitive" test flakiness).
    - name: Run tests
      run: cargo test --features eframe/x11,eframe/wayland --verbose -- --test-threads=1
      env:
        RUST_BACKTRACE: 1

  # Validates the opt-in ndarray-backend feature (issue #58): default job above never
  # exercises it, so without this job the CPU backend path would go untested by CI entirely.
  # Still installs lavapipe: Cargo feature unification means burn/wgpu stays linked in even
  # with ndarray-backend on (additive, not a replacement), so pinn-app/pinn-gui's Wgpu-only
  # code paths still need a Vulkan driver present to build/link.
  build-ndarray:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Mesa software Vulkan driver (lavapipe)
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-vulkan-drivers

    - name: Build (ndarray-backend)
      run: cargo build -p pinn-app --features eframe/x11,eframe/wayland,ndarray-backend --verbose

    - name: Run tests (ndarray-backend)
      run: cargo test -p pinn-solver --features ndarray-backend --verbose -- --test-threads=1
      env:
        RUST_BACKTRACE: 1
