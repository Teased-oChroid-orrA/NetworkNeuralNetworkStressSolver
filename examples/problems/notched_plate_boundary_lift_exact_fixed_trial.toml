# Controlled follow-up to notched_plate_boundary_lift_trial.toml:
# only hard_fixed_holes differs. Fixed mask is compactly supported away from
# Free and outer boundaries; this validation plate does not define solver scope.
formulation = "Variational"

[geometry]
half_w = 0.10
half_h = 0.05
thickness = 0.005

[[geometry.holes]]
center = [-0.03, 0.0]
radius = 0.01
bc = "Free"

[[geometry.holes]]
center = [0.03, 0.0]
radius = 0.008
bc = "Fixed"

[material]
e = 71.7e9
nu = 0.33
density = 2810.0
ultimate_strength_pa = 503e6

[load]
px = 6.9e7
py = 0.0

[network]
hidden_dim = 64
n_hidden = 3

[architecture]
hard_constraint_ansatz = true
free_boundary_lifting = true
hard_fixed_holes = true
training_procedure = "SingleDomain"

[training]
max_steps = 1000
n_interior = 2048
n_boundary = 512
fd_h = 1e-3
lr = 1e-3
measure_aware_training = true
amr_enabled = true
