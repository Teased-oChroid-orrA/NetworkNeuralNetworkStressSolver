# Issue #62 PH3-05: production benchmark configuration for the PURE Variational (Deep Energy
# Method) formulation, with measure-aware training enabled (PH3-04). Identical material/load/
# geometry/network/training parameters to `no_hole_plate.toml` (the legacy Hybrid baseline
# frozen for PH3-01 at `Debug_run/baseline_legacy_no_hole/`) - this file differs ONLY in
# `formulation = "Variational"` activates atomic `physical_potential = U-W_ext` plus essential
# constraints - NO `equilibrium`/`outer_traction` penalty, since a
# correctly-posed W_ext already encodes the natural traction-free boundary automatically) and
# `training.measure_aware_training = true` (PH3-04's real, tested measure-aware integral path).
#
# Issue #64: `n_interior`/`n_boundary`/`max_steps` raised from 2048/512/2000 to 4096/2048/3000.
# The root cause of #64's field-recovery failure was `UserSamplingStrategy::sample_interior`/
# `sample_boundary` returning the byte-identical point cloud on every call for a no-hole
# geometry (a stale deterministic grid, and no-op RNG rejection fallback that never triggered)
# — the training loop's own "resample every step" call was silently a no-op, letting the
# network overfit that one frozen finite quadrature-node set instead of the true continuous
# Pi=U-W_ext functional (normalized Pi settled at -1.02 to -1.05, BELOW the true continuum
# affine minimum of exactly -1 — only possible for a biased fixed-sample estimate, never for
# the real convex functional). Fixed in `UserSamplingStrategy` via genuine per-call jittered
# stratified sampling. At the ORIGINAL 2048/512/2000 config the fix alone already took
# normalized Pi to -0.9999 and load_transfer_ratio from ~0.88 to 0.97, and cut
# sigma_xx_relative_error from ~0.12 to 0.018 — but 3 of 5 hard L4 metrics still narrowly
# missed the 1%/[0.99,1.01] thresholds. Raising quadrature resolution (more points shrink the
# jittered-stratified estimator's residual variance) and step budget closed the remaining gap:
# this exact config reached normalized_Pi=-1.000017 and PASSED all five P2-14 hard thresholds
# (sigma_xx_relative_error=0.0010, sigma_yy/ref=0.0007, sigma_xy/ref=0.0003,
# traction_rms/ref=0.0011, load_transfer_ratio=0.9991), plus the independent field validation
# (separate 96x96 grid, not the training collocation points) also passed. See
# `Debug_run/phase4/issue64_resample_fix/` for the full solver logs and
# `docs/PHASE_4_IMPLEMENTATION_MANIFEST.md`'s PH4-06 entry for the complete writeup.
#
# Run with: cargo run -p pinn-app --release -- --headless --problem-spec examples/problems/variational_no_hole_plate.toml
#
# All lengths in meters [m], all stresses/moduli in pascals [Pa].

formulation = "Variational"

[geometry]
half_w = 0.10
half_h = 0.10
thickness = 0.005
holes = []

[material]
e = 71.7e9               # Al 7075-T6
nu = 0.33
density = 2810.0
ultimate_strength_pa = 503e6

[load]
px = 6.9e7
py = 0.0

[network]
hidden_dim = 64
n_hidden = 8

[training]
max_steps = 3000
n_interior = 4096
n_boundary = 2048
fd_h = 1e-3
lr = 1e-3
measure_aware_training = true
