# Issue #77 PH4-42: the exact L5 configuration this codebase's own investigation used to
# verify the hard-constraint-ansatz single-domain architecture converges to the FEM reference
# (Kt=2.460638516) within 0.67% - see docs/PHASE_4_IMPLEMENTATION_MANIFEST.md's PH4-42 entry
# for the real, reproducing corrected numbers this exact config produced (Kt=2.444127304,
# repeated at 2.444274). Also the first TOML-reachable use of `[architecture]` (PH4-45) -
# every field pre-#77 specs never had, `#[serde(default)]`s to the old plain dispatch.
#
# Run with: cargo run -p pinn-app --release -- --headless --problem-spec examples/problems/issue_77_l5_hard_constraint.toml
#
# This is a small hole (radius/half-width ratio 0.05, the same "L5" shape
# docs/PHASE_4_IMPLEMENTATION_MANIFEST.md's PH4-24..44 investigation used throughout) and
# 3000 steps at hidden_dim=64/n_hidden=8 - expect this to take a while (PH4-42's own real run
# was measured in tens of minutes on a release build). Lower `training.max_steps` for a quick
# smoke check of the wiring itself, not a Kt-accuracy claim.

formulation = "Variational"

[geometry]
half_w = 0.10
half_h = 0.10
thickness = 0.005

[[geometry.holes]]
center = [0.0, 0.0]
radius = 0.005           # 5 mm - the real L5 shape, radius/half_w = 0.05
bc = "Free"              # traction-free hole boundary

[material]
e = 71.7e9                # Al 7075-T6
nu = 0.33
density = 2810.0
ultimate_strength_pa = 503e6

[load]
px = 6.9e7                 # far-field traction in x, ~10 ksi
py = 0.0

[network]
hidden_dim = 64
n_hidden = 8

[training]
max_steps = 3000
n_interior = 4096
n_boundary = 4096
fd_h = 1e-3
lr = 1e-3
measure_aware_training = true
amr_enabled = true

[architecture]
hard_constraint_ansatz = true   # Phase 1/PH4-35's exact closed-form hard-constraint hole ansatz
hole_bias_fraction = 0.5        # near-hole stratified sampling, quadrature-compensated (PH4-41 fix)
# coordinate_embedding = "Cartesian"  (default - omit to keep it)
#
# This L5 geometry ALSO happens to qualify for the two-domain annular-decomposition path
# (Variational + measure_aware_training + a single centered Free hole with room for an
# annular partition) - "SingleDomain" is REQUIRED here to force the actual single-domain
# `UserDefinedProblem` path PH4-42 verified, not the different two-domain architecture the
# default "Joint" dispatch would otherwise silently select instead for a geometry this shape.
training_procedure = "SingleDomain"
# For Phase 2's sequential two-stage procedure instead (which trains the two-domain path,
# so leave training_procedure at its "Joint" default and add this in its place):
#   [architecture.training_procedure]
#   SequentialTwoStage = { stage_a_steps = 1500, stage_b_steps = 1500 }
