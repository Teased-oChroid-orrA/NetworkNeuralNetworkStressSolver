# Example user-defined problem: a square plate with a single centered, traction-free
# hole under uniaxial far-field tension — the simplest possible benchmark case (no
# asymmetry from off-center or mixed-BC holes), useful as a first sanity check before
# trying `notched_plate.toml`'s two-hole, mixed-BC case.
#
# Run with: cargo run -p pinn-app --release -- --headless --problem-spec examples/problems/single_hole_plate.toml
#
# All lengths in meters [m], all stresses/moduli in pascals [Pa].

[geometry]
half_w = 0.10   # full width  = 0.20 m
half_h = 0.10   # full height = 0.20 m (square plate)
thickness = 0.005

[[geometry.holes]]
center = [0.0, 0.0]
radius = 0.02            # 20 mm, centered
bc = "Free"              # traction-free hole boundary

[material]
e = 71.7e9               # Al 7075-T6
nu = 0.33
density = 2810.0
ultimate_strength_pa = 503e6

[load]
px = 6.9e7                # far-field traction in x, ~10 ksi
py = 0.0

[network]
hidden_dim = 64
n_hidden = 8

[training]
max_steps = 2000
n_interior = 2048
n_boundary = 512
fd_h = 1e-3
lr = 1e-3
