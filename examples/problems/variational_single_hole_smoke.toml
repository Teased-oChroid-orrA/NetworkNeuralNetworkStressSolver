# Issue #63 sub-issue #69: single-hole topology smoke verification for the corrected
# Variational formulation - does the machinery (sampling near a hole, FieldKind-resolved
# stress-source distinction, hole-BC terms, gauge/nullspace handling) run cleanly end-to-end,
# producing sane (finite, non-negative) diagnostics? NOT a hard Kt-accuracy claim - that's
# issue #63 sub-issue #70 (real L5)'s job, which needs much longer convergence. Short step
# budget deliberately - this is a machinery smoke test, not a convergence benchmark.
#
# Run with: cargo run -p pinn-app --release -- --headless --problem-spec examples/problems/variational_single_hole_smoke.toml

formulation = "Variational"

[geometry]
half_w = 0.10
half_h = 0.10
thickness = 0.005

[[geometry.holes]]
center = [0.0, 0.0]
radius = 0.02
bc = "Free"

[material]
e = 71.7e9
nu = 0.33
density = 2810.0
ultimate_strength_pa = 503e6

[load]
px = 6.9e7
py = 0.0

[network]
hidden_dim = 64
n_hidden = 8

[training]
max_steps = 800
n_interior = 2048
n_boundary = 1024
fd_h = 1e-3
lr = 1e-3
measure_aware_training = true
amr_enabled = false
